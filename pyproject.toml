[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socest"
version = "0.1.0"
description = "Physics-based (ECM + EKF) and data-driven (Transformer) SoC estimation on the LG 18650HG2 dataset"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Seyyed Ali Sadat" }]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
